<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Hotspot Kamal</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            text-align: center;
        }

        .container {
            max-width: 400px;
            margin: 80px auto;
            background: rgba(0,0,0,0.5);
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: none;
            border-radius: 6px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #00c6ff;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background: #0094cc;
        }

        .footer {
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post" style="display:none">
    <input type="hidden" name="username" />
    <input type="hidden" name="password" />
    <input type="hidden" name="dst" value="$(link-orig)" />
    <input type="hidden" name="popup" value="true" />
</form>

<script src="/md5.js"></script>
<script>
function doLogin() {
    document.sendin.username.value = document.login.username.value;
    document.sendin.password.value =
        hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
    document.sendin.submit();
    return false;
}
</script>
$(endif)

<div class="container">
    <h1>Welcome to Hotspot Kamal</h1>
    <p>Silakan login untuk mengakses internet</p>

    <form name="login" action="$(link-login-only)" method="post"
    $(if chap-id) onSubmit="return doLogin()" $(endif)>

        <input type="hidden" name="dst" value="$(link-orig)" />
        <input type="hidden" name="popup" value="true" />

        <input name="username" type="text" placeholder="Username" />
        <input name="password" type="password" placeholder="Password" />

        <input type="submit" value="Connect">
    </form>

    $(if trial == 'yes')
    <p>
        <a style="color:#00c6ff;"
        href="$(link-login-only)?dst=$(link-orig-esc)&username=T-$(mac-esc)">
        Free Trial
        </a>
    </p>
    $(endif)

    <div class="footer">
        Powered by MikroTik
    </div>
</div>

</body>
</html>
